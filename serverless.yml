service: ms-presupuestos

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    DB_HOST: ${cf:infra-compartida-${sls:stage}.RdsEndpoint}
    DB_NAME: ppm_presupuestos
    DB_USER: ${ssm:/ppm/presupuestos/db-user}
    DB_PASSWORD: ${ssm:/ppm/presupuestos/db-password}
    UMBRAL_ALERTA_PCT: "90"
  # AWS Academy no permite crear roles IAM: se reusa LabRole.
  # En una cuenta propia, borra la linea `role:` y descomenta los permisos,
  # que son los minimos que este microservicio necesita.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
    # role:
    #   statements:
  #     - Effect: Allow
  #       Action:
  #         - sns:Publish
  #       Resource: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:PutItem
  #       Resource: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesadosArn}
  #
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    # true, no "non-linux": en Linux "non-linux" NO usa Docker y busca un
    # binario python3.12 local, que no existe (el sistema trae 3.14).
    # Forzar Docker ademas garantiza que psycopg se compile contra Amazon
    # Linux, que es donde corre la Lambda.
    dockerizePip: true
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache
  autorizador:
    # El authorizer vive en infra-compartida y lo comparten los 6 microservicios
    name: autorizadorCompartido
    type: request
    arn: ${cf:infra-compartida-${sls:stage}.AutorizadorArn}
    resultTtlInSeconds: 300
    identitySource: method.request.header.Authorization

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarPresupuestos:
    handler: src/handlers/presupuestos.listar
    description: Ejecucion presupuestal de todos los proyectos del tenant
    events:
      - http: { path: "/presupuestos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  obtenerPresupuesto:
    handler: src/handlers/presupuestos.obtener
    description: Detalle con partidas, ultimos gastos y proyeccion de horas
    events:
      - http: { path: "/presupuestos/{proyecto_id}", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  aprobarPresupuesto:
    handler: src/handlers/presupuestos.aprobar
    description: El PMO fija el monto aprobado y las partidas
    events:
      - http: { path: "/presupuestos/{proyecto_id}/aprobar", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  listarGastos:
    handler: src/handlers/presupuestos.listar_gastos
    events:
      - http: { path: "/presupuestos/{proyecto_id}/gastos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  registrarGasto:
    handler: src/handlers/presupuestos.registrar_gasto
    description: Publica gasto.registrado y, al cruzar el 90%, presupuesto.excedido
    events:
      - http: { path: "/presupuestos/{proyecto_id}/gastos", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  resumenEjecucion:
    handler: src/handlers/presupuestos.resumen
    description: Totales del tenant para el dashboard
    events:
      - http: { path: "/ejecucion", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  worker:
    handler: src/handlers/worker.manejar
    description: Crea presupuestos y proyecta costos a partir de eventos
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaPresupuestos.Arn
          batchSize: 10

resources:
  Resources:
    ColaPresupuestos:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-presupuestos-${sls:stage}
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaPresupuestosDLQ.Arn
          maxReceiveCount: 3

    ColaPresupuestosDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-presupuestos-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionPresupuestos:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaPresupuestos.Arn
        FilterPolicy:
          tipo:
            - proyecto.creado
            - recurso.asignado

    PermisoSnsEnCola:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaPresupuestos
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaPresupuestos.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
