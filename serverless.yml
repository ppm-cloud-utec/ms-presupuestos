service: ms-presupuestos

frameworkVersion: "3"

provider:
  name: aws
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    DB_HOST: ${cf:infra-compartida-${sls:stage}.RdsEndpoint}
    DB_NAME: ppm_presupuestos
    DB_SECRETO: ppm/presupuestos/db
    UMBRAL_ALERTA_PCT: "90"
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"
    - "seed/esquema.sql"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    cacheLocation: ./.serverless-cache
  autorizador:
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/presupuestos/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarPresupuestos:
    handler: src/handlers/presupuestos.listar
    description: Ejecucion presupuestal de todos los proyectos del tenant
    events:
      - http: { path: "/presupuestos/presupuestos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  obtenerPresupuesto:
    handler: src/handlers/presupuestos.obtener
    description: Detalle con partidas, ultimos gastos y proyeccion de horas
    events:
      - http: { path: "/presupuestos/presupuestos/{proyecto_id}", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  aprobarPresupuesto:
    handler: src/handlers/presupuestos.aprobar
    description: El PMO fija el monto aprobado y las partidas
    events:
      - http: { path: "/presupuestos/presupuestos/{proyecto_id}/aprobar", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  listarGastos:
    handler: src/handlers/presupuestos.listar_gastos
    events:
      - http: { path: "/presupuestos/presupuestos/{proyecto_id}/gastos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  registrarGasto:
    handler: src/handlers/presupuestos.registrar_gasto
    description: Publica gasto.registrado y, al cruzar el 90%, presupuesto.excedido
    events:
      - http: { path: "/presupuestos/presupuestos/{proyecto_id}/gastos", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  resumenEjecucion:
    handler: src/handlers/presupuestos.resumen
    description: Totales del tenant para el dashboard
    events:
      - http: { path: "/presupuestos/ejecucion", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  worker:
    handler: src/handlers/worker.manejar
    description: Crea presupuestos y proyecta costos a partir de eventos
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaPresupuestos.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  aprovisionarTenant:
    handler: src/handlers/aprovisionar.aprovisionar
    name: ms-presupuestos-${sls:stage}-aprovisionarTenant
    description: Crea el schema del tenant y aplica el DDL de este servicio
    timeout: 60

  compensarTenant:
    handler: src/handlers/aprovisionar.compensar
    name: ms-presupuestos-${sls:stage}-compensarTenant
    description: "Rollback del alta: elimina el schema del tenant"
    timeout: 30

resources:
  Resources:
    ColaPresupuestos:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-presupuestos-${sls:stage}
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaPresupuestosDLQ.Arn
          maxReceiveCount: 3

    ColaPresupuestosDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-presupuestos-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionPresupuestos:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaPresupuestos.Arn
        FilterPolicy:
          tipo:
            - proyecto.creado
            - recurso.asignado

    PermisoSnsEnCola:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaPresupuestos
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaPresupuestos.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}

